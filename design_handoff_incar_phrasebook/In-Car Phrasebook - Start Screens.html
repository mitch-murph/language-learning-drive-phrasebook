<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>In-Car Phrasebook · Start Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ui: 'Hanken Grotesk', system-ui, sans-serif;
    --jp: 'Zen Kaku Gothic New', 'Hanken Grotesk', sans-serif;
    --kr: 'Noto Sans KR', 'Hanken Grotesk', sans-serif;
  }
  .theme-cozy {
    --bg: oklch(0.93 0.026 72); --surface: oklch(0.965 0.022 72); --line: oklch(0.83 0.034 65);
    --fg: oklch(0.31 0.045 48); --muted: oklch(0.5 0.042 52); --muted2: oklch(0.62 0.036 58);
    --amber: oklch(0.54 0.14 42); --green: oklch(0.5 0.075 128);
  }
  .theme-dark {
    --bg: oklch(0.17 0.008 250); --surface: oklch(0.225 0.011 250); --line: oklch(0.32 0.012 250);
    --fg: oklch(0.96 0.004 250); --muted: oklch(0.67 0.013 250); --muted2: oklch(0.52 0.013 250);
    --amber: oklch(0.83 0.15 75); --green: oklch(0.85 0.17 145);
  }
  html, body { margin: 0; height: 100%; background: #e9e6e0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="screens/start-screens.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const PHONE = { width: 390, height: 844, style: { background: 'var(--bg)', borderRadius: 38 } };
const Th = ({ c, children }) => <div className={c} style={{ height: '100%', background: 'var(--bg)' }}>{children}</div>;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="langhome" title="Home — phrases by language" subtitle="Browse phrases grouped by language; select across languages to build one mixed session.">
        <DCArtboard id="lang" label="Phrases by language (Cozy)" {...PHONE}><Th c="theme-cozy"><window.LanguageLibrary /></Th></DCArtboard>
        <DCArtboard id="lang-d" label="Phrases by language (Dark)" {...PHONE}><Th c="theme-dark"><window.LanguageLibrary /></Th></DCArtboard>
      </DCSection>

      <DCSection id="flow" title="Start &amp; select — earlier directions" subtitle="Home → choose a deck → pick phrases → drive. Static layouts (Cozy theme).">
        <DCArtboard id="home" label="Home / Start" {...PHONE}><Th c="theme-cozy"><window.HomeScreen /></Th></DCArtboard>
        <DCArtboard id="decks" label="Choose a deck" {...PHONE}><Th c="theme-cozy"><window.DeckPicker /></Th></DCArtboard>
        <DCArtboard id="phrases" label="Select phrases" {...PHONE}><Th c="theme-cozy"><window.PhraseSelect /></Th></DCArtboard>
      </DCSection>

      <DCSection id="endsession" title="End of session" subtitle="Shown when you tap the handle to leave (or once every phrase is learned).">
        <DCArtboard id="done" label="Session complete (Cozy)" {...PHONE}><Th c="theme-cozy"><window.SessionComplete /></Th></DCArtboard>
        <DCArtboard id="done-d" label="Session complete (Dark)" {...PHONE}><Th c="theme-dark"><window.SessionComplete /></Th></DCArtboard>
      </DCSection>

      <DCSection id="dark" title="Dark theme" subtitle="Same screens in the dark palette">
        <DCArtboard id="home-d" label="Home / Start" {...PHONE}><Th c="theme-dark"><window.HomeScreen /></Th></DCArtboard>
        <DCArtboard id="decks-d" label="Choose a deck" {...PHONE}><Th c="theme-dark"><window.DeckPicker /></Th></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

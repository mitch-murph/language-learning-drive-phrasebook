<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>In-Car Phrasebook · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ui: 'Hanken Grotesk', system-ui, sans-serif;
    --jp: 'Zen Kaku Gothic New', 'Hanken Grotesk', sans-serif;
    --kr: 'Noto Sans KR', 'Hanken Grotesk', sans-serif;
  }
  .theme-dark {
    --bg: oklch(0.17 0.008 250); --surface: oklch(0.225 0.011 250); --line: oklch(0.32 0.012 250);
    --fg: oklch(0.96 0.004 250); --muted: oklch(0.67 0.013 250); --muted2: oklch(0.52 0.013 250);
    --amber: oklch(0.83 0.15 75); --green: oklch(0.85 0.17 145);
  }
  .theme-daylight {
    --bg: oklch(0.97 0.009 85); --surface: oklch(0.995 0.006 85); --line: oklch(0.88 0.014 75);
    --fg: oklch(0.27 0.022 55); --muted: oklch(0.5 0.022 55); --muted2: oklch(0.66 0.02 60);
    --amber: oklch(0.58 0.17 38); --green: oklch(0.52 0.12 150);
  }
  .theme-cozy {
    --bg: oklch(0.93 0.026 72); --surface: oklch(0.965 0.022 72); --line: oklch(0.83 0.034 65);
    --fg: oklch(0.31 0.045 48); --muted: oklch(0.5 0.042 52); --muted2: oklch(0.62 0.036 58);
    --amber: oklch(0.54 0.14 42); --green: oklch(0.5 0.075 128);
  }
  .theme-hud {
    --bg: oklch(0.13 0.006 250); --surface: oklch(0.18 0.012 250); --line: oklch(0.29 0.018 235);
    --fg: oklch(0.97 0.006 230); --muted: oklch(0.64 0.05 205); --muted2: oklch(0.48 0.04 205);
    --amber: oklch(0.85 0.15 88); --green: oklch(0.85 0.13 195);
  }
  html, body { margin: 0; height: 100%; }
  body { background: #1b1916; display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-family: var(--ui); }
  * { box-sizing: border-box; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .switcher { display: flex; gap: 8px; }
  .switcher.mobile { gap: 6px; padding: 9px 12px; overflow-x: auto; justify-content: center; flex-wrap: nowrap; }
  .switcher button { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); color: rgba(255,255,255,.7);
    font-family: var(--ui); font-size: 13px; font-weight: 600; padding: 7px 15px; border-radius: 20px; cursor: pointer;
    transition: all .15s; white-space: nowrap; }
  .switcher button:hover { background: rgba(255,255,255,.1); color: #fff; }
  .switcher button[data-on="1"] { background: #fff; color: #1b1916; border-color: #fff; }
  .phone-shell { border-radius: 46px; padding: 9px; background: #050505;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.08), 0 40px 90px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2b2620"/><g fill="none" stroke="#d99a5b" stroke-width="4" stroke-linecap="round"><path d="M50 30v40"/><path d="M38 40v20M62 40v20M30 47v6M70 47v6"/></g><circle cx="50" cy="50" r="30" fill="none" stroke="#8aa86a" stroke-width="3" opacity=".6"/></svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="screens/home.jsx"></script>
<script type="text/babel" src="screens/prototype.jsx"></script>

<script type="text/babel">
const THEMES = [
  { k: 'theme-cozy', label: 'Cozy' },
  { k: 'theme-daylight', label: 'Daylight' },
  { k: 'theme-dark', label: 'Dark' },
  { k: 'theme-hud', label: 'Night HUD' },
];

function Root() {
  const [theme, setTheme] = React.useState('theme-cozy');
  const [scale, setScale] = React.useState(1);
  const [mobile, setMobile] = React.useState(false);
  const [view, setView] = React.useState('home');
  const [deck, setDeck] = React.useState(null);
  const [session, setSession] = React.useState(0);
  React.useEffect(() => {
    const fit = () => {
      const m = window.innerWidth <= 540;
      setMobile(m);
      const s = Math.min(1, (window.innerHeight - 48) / 844, (window.innerWidth - 40) / 390);
      setScale(s);
    };
    fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit);
  }, []);
  React.useEffect(() => { try { window.speechSynthesis && window.speechSynthesis.getVoices(); } catch (e) {} }, []);

  const start = (d) => { setDeck(d); setSession((s) => s + 1); setView('drive'); };
  const goHome = () => { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} setView('home'); };
  const radius = mobile ? 0 : 38;
  const content = view === 'home'
    ? <window.Home theme={theme} setTheme={setTheme} radius={radius} onStart={start} />
    : <window.Prototype key={session} theme={theme} setTheme={setTheme} radius={radius} deck={deck} onBack={goHome} />;

  if (mobile) {
    return <div style={{ position: 'fixed', inset: 0, background: '#000' }}>{content}</div>;
  }
  return (
    <div id="stage">
      <div className="phone-shell" style={{ transform: `scale(${scale})`, transformOrigin: 'top center' }}>
        <div style={{ width: 390, height: 844 }}>
          {content}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
